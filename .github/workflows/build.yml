name: Build APK

on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests et analyse : visibles dans l'onglet Actions, sans bloquer la production de l'APK.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests du convertisseur Ciqual
        run: node --test tool/ciqual_lib.test.mjs tool/additives_lib.test.mjs
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyse statique
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests Flutter
        shell: bash
        run: flutter test --reporter expanded 2>&1 | tee checks.log

      - name: Publier le journal des tests
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p /tmp/checks-log && cp checks.log /tmp/checks-log/ 2>/dev/null || echo "pas de journal" > /tmp/checks-log/checks.log
          cd /tmp/checks-log
          echo "run ${{ github.run_number }} sha ${{ github.sha }} status ${{ job.status }}" > status.txt
          git init -q && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "tests run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-log-checks

  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache des XML Ciqual
        uses: actions/cache@v4
        with:
          path: .ciqual-cache
          key: ciqual-2025_11_03

      # Si la conversion échoue, l'APK est quand même construit : le scan et la photo
      # fonctionnent, la recherche affiche « Base d'aliments indisponible ».
      - name: Base Ciqual (régénérée si absente ou d'un ancien format)
        continue-on-error: true
        run: |
          FMT=$(node -e 'try{console.log(require("./assets/data/ciqual.json").formatVersion||1)}catch{console.log(0)}')
          if [ "$FMT" != "2" ]; then
            node tool/build_ciqual.mjs 2>&1 | tee -a ci.log || { echo "::warning::Base Ciqual non générée."; exit 1; }
          else
            echo "assets/data/ciqual.json à jour (format $FMT)." | tee -a ci.log
          fi

      - name: Noms des additifs (générés si absents)
        continue-on-error: true
        run: |
          if [ ! -f assets/data/additives.json ]; then
            node tool/build_additives.mjs 2>&1 | tee -a ci.log || { echo "::warning::Table des additifs non générée."; exit 1; }
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Projet Android
        run: |
          flutter --version 2>&1 | tee -a ci.log
          bash tool/setup_android.sh 2>&1 | tee -a ci.log

      - run: flutter pub get 2>&1 | tee -a ci.log

      - name: Build APK
        run: flutter build apk --release 2>&1 | tee -a ci.log

      # Branche release -> version publiée vX.Y.Z (lue dans pubspec.yaml) ; main -> pré-version de test build-N.
      - name: Nom de la version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
          if [ "$GITHUB_REF" = "refs/heads/release" ]; then
            TAG="v$VERSION"; TITLE="Caillou $TAG"; PRE=false; LATEST=true
          else
            TAG="build-${{ github.run_number }}"; TITLE="Caillou — build ${{ github.run_number }} (test)"; PRE=true; LATEST=false
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "caillou-$TAG.apk"
          { echo "TAG=$TAG"; echo "TITLE=$TITLE"; echo "PRE=$PRE"; echo "LATEST=$LATEST"; echo "APK_NAME=caillou-$TAG.apk"; } >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: caillou-apk
          path: ${{ env.APK_NAME }}

      - name: Publier la version
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TITLE }}
          prerelease: ${{ env.PRE }}
          make_latest: ${{ env.LATEST }}
          body_path: RELEASE_NOTES.md
          files: ${{ env.APK_NAME }}

      # Journal lisible sans connexion (git fetch origin ci-log), utile pour diagnostiquer un échec.
      - name: Publier le journal de build
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/ci-log && cp ci.log /tmp/ci-log/ci.log 2>/dev/null || echo "pas de journal" > /tmp/ci-log/ci.log
          cp assets/data/ciqual.json assets/data/additives.json /tmp/ci-log/ 2>/dev/null || true
          cd /tmp/ci-log
          echo "run ${{ github.run_number }} sha ${{ github.sha }} status ${{ job.status }}" > status.txt
          git init -q && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "journal run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-log
