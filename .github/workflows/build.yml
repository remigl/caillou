name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests et analyse : visibles dans l'onglet Actions, sans bloquer la production de l'APK.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests du convertisseur Ciqual
        run: node --test tool/ciqual_lib.test.mjs
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyse statique
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests Flutter
        run: flutter test

  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache des XML Ciqual
        uses: actions/cache@v4
        with:
          path: .ciqual-cache
          key: ciqual-2025_11_03

      # Si la conversion échoue, l'APK est quand même construit : le scan et la photo
      # fonctionnent, la recherche affiche « Base d'aliments indisponible ».
      - name: Base Ciqual (générée si absente du dépôt)
        continue-on-error: true
        run: |
          if [ ! -f assets/data/ciqual.json ]; then
            node tool/build_ciqual.mjs 2>&1 | tee -a ci.log || { echo "::warning::Base Ciqual non générée, APK construit sans."; exit 1; }
          else
            echo "assets/data/ciqual.json présent, conversion ignorée." | tee -a ci.log
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Projet Android
        run: |
          flutter --version 2>&1 | tee -a ci.log
          bash tool/setup_android.sh 2>&1 | tee -a ci.log

      - run: flutter pub get 2>&1 | tee -a ci.log

      - name: Build APK
        run: flutter build apk --release 2>&1 | tee -a ci.log

      - name: Renommer l'APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="caillou-${GITHUB_REF_NAME}.apk"; else NAME="caillou-build-${{ github.run_number }}.apk"; fi
          cp build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: caillou-apk
          path: ${{ env.APK_NAME }}

      # Tag vX.Y.Z -> version publiée ; push sur main -> pré-version de test build-N.
      - name: Publier la version
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Caillou {0}', github.ref_name) || format('Caillou — build {0} (test)', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
          body_path: RELEASE_NOTES.md
          files: ${{ env.APK_NAME }}

      # Journal lisible sans connexion (git fetch origin ci-log), utile pour diagnostiquer un échec.
      - name: Publier le journal de build
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/ci-log && cp ci.log /tmp/ci-log/ci.log 2>/dev/null || echo "pas de journal" > /tmp/ci-log/ci.log
          cp assets/data/ciqual.json /tmp/ci-log/ 2>/dev/null || true
          cd /tmp/ci-log
          echo "run ${{ github.run_number }} sha ${{ github.sha }} status ${{ job.status }}" > status.txt
          git init -q && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "journal run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-log
